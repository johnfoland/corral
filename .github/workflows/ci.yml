name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: lint (ruff, ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    # Build the sdist and wheel, then install each into a fresh environment
    # and run the installed command: catches packaging mistakes (a module
    # left out of the wheel, a dependency missing from the metadata) that
    # the tests, which run from the source tree, can't see.
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel and the sdist
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Code/demo/.git"
          export CORRAL_CONFIG="$RUNNER_TEMP/none.toml"
          for dist in dist/*.whl dist/*.tar.gz; do
            env="$RUNNER_TEMP/venv-$(basename "$dist")"
            uv venv -q "$env"
            uv pip install -q --python "$env" "$dist"
            "$env/bin/corral" --version
            "$env/bin/corral" models > /dev/null
            "$env/bin/corral" ls --json --root "$RUNNER_TEMP/Code" | grep -q '"project": "demo"'
            "$env/bin/python" -c "import corral.tui.app, corral.tui.settings"
          done

  ok:
    # The one check branch protection requires, so the matrix can change
    # without editing the protection rule.
    name: CI passed
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.package.result }}" = success

  commits:
    name: conventional commit titles
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
